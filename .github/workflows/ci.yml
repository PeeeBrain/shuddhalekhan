name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache

      - name: Typecheck, lint, and test
        run: bun run check

      - name: Verify Electron native dependencies
        run: bun x electron-builder install-app-deps
        working-directory: app

  linux-dictation:
    name: Linux Dictation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check release publication retry guards
        run: python3 -B -m unittest discover -s .github/scripts/__tests__ -p '*_test.py'
      - name: Install X11 test server and native libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libxcb1 libxcb-xfixes0 libxcb-xtest0 unzip
      - name: Install dependencies without packaging hooks
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check capture and desktop protocol contracts
        run: bun test app/src/main/desktop/__tests__ app/src/main/native/__tests__/linux-input.test.ts app/src/main/__tests__/audio-spool.test.ts app/src/main/__tests__/keyboard.test.ts app/src/renderer/__tests__/audio-capture.test.ts app/src/renderer/__tests__/audio-capture-worklet.test.ts app/src/main/__tests__/managed-local-model.test.ts
      - name: Check native X11 focus, ownership and paste
        run: bun test app/src/main/native/__tests__/x11-target.integration.test.ts app/src/main/desktop/__tests__/x11-shortcuts.integration.test.ts
        env:
          SHUDDHALEKHAN_X11_INTEGRATION: '1'
