name: Mobile iOS

on:
  pull_request:
    paths:
      - "mobile/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "packages/shared/**"
      - ".github/workflows/mobile-ios.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "packages/shared/**"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check IPA update runtime resolution
        run: python3 -B -m unittest discover -s mobile/scripts/__tests__ -p '*_test.py'

      - name: Check iOS build version probe
        run: bash mobile/scripts/__tests__/build-ios-version.test.sh

      - name: Test mobile logic
        run: bun run --cwd mobile test

      - name: Typecheck mobile app
        run: bun run --cwd mobile typecheck

      - name: Lint mobile app
        run: bun run --cwd mobile lint

      - name: Lint platform-free shared package
        run: bun run --cwd packages/shared lint

      - name: Verify Expo native dependencies
        working-directory: mobile
        run: bunx expo-doctor

      - name: Export iOS JavaScript bundle
        run: bun run --cwd mobile export:ios

  unsigned-ipa:
    name: Build unsigned iOS IPA
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Build release IPA without code signing
        run: bash mobile/scripts/build-ios.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: Shuddhalekhan-unsigned-ipa
          path: mobile/build/ipa/Shuddhalekhan-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
