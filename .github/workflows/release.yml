name: Release Windows App

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: blacksmith-4vcpu-windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: Bun 1.4.0 rejects the AbortSignal init @ai-sdk/mcp passes to fetch.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Derive application version from release tag
        id: release_version
        shell: pwsh
        working-directory: app
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Invalid semantic version release tag: $tag"
          }

          $version = $Matches[1]
          bun pm pkg set "version=$version"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Shuddhalekhan $version from tag $tag."

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Prepare release notes from the changelog
        shell: pwsh
        run: |
          $version = '${{ steps.release_version.outputs.version }}'
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          bun run --cwd app release-notes:prepare -- `
            --version $version `
            --markdown-output $notesFile `
            --json-output release-notes.json

      - name: Build
        run: bun run --cwd app build

      - name: Package and publish Electron app
        run: bun run --cwd app dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize GitHub release metadata
        shell: pwsh
        run: |
          $tag = '${{ steps.release_version.outputs.tag }}'
          $version = '${{ steps.release_version.outputs.version }}'
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          gh release edit $tag `
            --title "Shuddhalekhan $version" `
            --notes-file $notesFile `
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
