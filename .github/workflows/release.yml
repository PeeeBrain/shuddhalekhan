name: Release App

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build with this workflow
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      commit: ${{ steps.release_version.outputs.commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release_version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid semantic version release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          args=(-f "tag_name=$RELEASE_TAG")
          if [[ -n "$previous_tag" ]]; then
            args+=(-f "previous_tag_name=$previous_tag")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > release-notes.md
          jq -n --arg version "$VERSION" --rawfile notes release-notes.md \
            '{version: $version, notes: $notes}' > release-notes.json

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "Refusing to overwrite published release $RELEASE_TAG." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$VERSION"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            release-notes.json
            release-notes.md
          if-no-files-found: error

      # Recovery builds use tagged product source and the build helper from this workflow's revision.
      - name: Upload iOS build helper
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-helper
          path: mobile/scripts/build-ios.sh
          if-no-files-found: error

  release-windows:
    needs: prepare
    runs-on: blacksmith-4vcpu-windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - name: Cache Electron and installer downloads
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: app

      - name: Set application version
        working-directory: app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bun pm pkg set "version=$env:VERSION"

      - name: Typecheck, lint, and test
        run: bun run check

      - name: Build
        run: bun run --cwd app build

      - name: Package and publish Electron app
        run: bun run --cwd app dist -- --publish always "-c.electronDownload.cache=${{ runner.temp }}/electron-cache"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

  release-linux:
    needs: prepare
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - name: Cache Electron and installer downloads
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: app

      - name: Derive application version from release tag
        working-directory: app
        run: bun pm pkg set "version=${RELEASE_TAG#v}"

      - name: Build
        run: bun run --cwd app build

      - name: Package and publish deb and rpm
        run: bun run --cwd app dist -- --linux deb rpm --publish always "-c.electronDownload.cache=${{ runner.temp }}/electron-cache"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

  # Attaches the unsigned IPA, signed later with iLoader. Finalize publishes the OTA.
  release-ios:
    needs: prepare
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    outputs:
      runtime-version: ${{ steps.runtime.outputs.version }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      # Expo's fingerprint ignores the version, so this does not split the OTA runtime.
      - name: Derive mobile version from release tag
        run: |
          jq --arg v "${RELEASE_TAG#v}" '.expo.version = $v' mobile/app.json > "$RUNNER_TEMP/app.json"
          mv "$RUNNER_TEMP/app.json" mobile/app.json

      - name: Download iOS build helper
        uses: actions/download-artifact@v8
        with:
          name: ios-build-helper
          path: mobile/scripts

      - name: Build unsigned IPA
        run: bash mobile/scripts/build-ios.sh

      # Carry the built native runtime across runners rather than recomputing its fingerprint on Linux.
      - name: Read OTA runtime from IPA
        id: runtime
        run: |
          unzip -p mobile/build/ipa/Shuddhalekhan-unsigned.ipa 'Payload/*.app/Expo.plist' > "$RUNNER_TEMP/Expo.plist"
          runtime=$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$RUNNER_TEMP/Expo.plist")
          test -n "$runtime"
          echo "version=$runtime" >> "$GITHUB_OUTPUT"

      - name: Attach IPA to draft release
        run: gh release upload "$RELEASE_TAG" mobile/build/ipa/Shuddhalekhan-unsigned.ipa --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: [prepare, release-windows, release-linux, release-ios]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      # OTA publication waits for every platform, but runs off the macOS build runner.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Match OTA version and runtime to the IPA
        env:
          RUNTIME_VERSION: ${{ needs.release-ios.outputs.runtime-version }}
        run: |
          jq --arg v "${RELEASE_TAG#v}" --arg runtime "$RUNTIME_VERSION" \
            '.expo.version = $v | .expo.runtimeVersion = $runtime' mobile/app.json > "$RUNNER_TEMP/app.json"
          mv "$RUNNER_TEMP/app.json" mobile/app.json

      - name: Publish OTA update
        working-directory: mobile
        run: npx --yes eas-cli@latest update --platform ios --channel production --environment production --message "$RELEASE_TAG" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Finalize GitHub release metadata
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Shuddhalekhan ${RELEASE_TAG#v}" \
            --notes-file release-notes.md \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
