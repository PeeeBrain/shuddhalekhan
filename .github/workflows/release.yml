name: Release App

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: blacksmith-4vcpu-windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - name: Cache Electron and installer downloads
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache

      - name: Derive application version from release tag
        id: release_version
        shell: pwsh
        working-directory: app
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Invalid semantic version release tag: $tag"
          }

          $version = $Matches[1]
          bun pm pkg set "version=$version"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Shuddhalekhan $version from tag $tag."

      - name: Typecheck, lint, and test
        run: bun run check

      - name: Generate release notes from merged pull requests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_version.outputs.tag }}'
          $version = '${{ steps.release_version.outputs.version }}'
          $previousTag = git describe --tags --abbrev=0 "$tag^" 2>$null

          if ($LASTEXITCODE -ne 0 -or -not $previousTag) {
            Write-Host 'No previous release tag found; generating notes from full history.'
            $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" `
              -f "tag_name=$tag" --jq .body
          } else {
            Write-Host "Generating release notes for $previousTag..$tag."
            $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" `
              -f "tag_name=$tag" -f "previous_tag_name=$previousTag" --jq .body
          }

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to generate release notes from merged pull requests.'
          }

          $notesText = $notes -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notesText -Encoding utf8
          @{ version = $version; notes = $notesText } |
            ConvertTo-Json |
            Set-Content -Path 'app/release-notes.json' -Encoding utf8

      - name: Build
        run: bun run --cwd app build

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $tag = '${{ steps.release_version.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title '${{ steps.release_version.outputs.version }}'
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish Electron app
        run: bun run --cwd app dist -- --publish always "-c.electronDownload.cache=${{ runner.temp }}/electron-cache"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Share release notes with later jobs
        shell: pwsh
        run: Copy-Item (Join-Path $env:RUNNER_TEMP 'release-notes.md') app/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            app/release-notes.json
            app/release-notes.md

  # Runs after the Windows job so it reuses its checks, draft release, and notes.
  release-linux:
    needs: release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: app

      - name: Derive application version from release tag
        working-directory: app
        run: bun pm pkg set "version=${GITHUB_REF_NAME#v}"

      - name: Build
        run: bun run --cwd app build

      - name: Package and publish deb and rpm
        run: bun run --cwd app dist -- --linux deb rpm --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Attaches the unsigned IPA (signed later with iLoader) and publishes the same JS as an OTA update.
  # Installs whose native fingerprint differs ignore the update until they install this IPA.
  release-ios:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      # Expo's fingerprint ignores the version, so this does not split the OTA runtime.
      - name: Derive mobile version from release tag
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.expo.version = $v' mobile/app.json > "$RUNNER_TEMP/app.json"
          mv "$RUNNER_TEMP/app.json" mobile/app.json

      - name: Build unsigned IPA
        run: bash mobile/scripts/build-ios.sh

      - name: Attach IPA to draft release
        run: gh release upload "$GITHUB_REF_NAME" mobile/build/ipa/Shuddhalekhan-unsigned.ipa --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OTA update
        working-directory: mobile
        run: npx --yes eas-cli@latest update --channel production --environment production --message "$GITHUB_REF_NAME" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  finalize:
    needs: [release, release-linux, release-ios]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Finalize GitHub release metadata
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Shuddhalekhan ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
