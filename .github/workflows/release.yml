name: Release Windows App

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: blacksmith-4vcpu-windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Derive application version from release tag
        id: release_version
        shell: pwsh
        working-directory: app
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Invalid semantic version release tag: $tag"
          }

          $version = $Matches[1]
          bun pm pkg set "version=$version"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Shuddhalekhan $version from tag $tag."

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Generate release notes from merged pull requests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_version.outputs.tag }}'
          $version = '${{ steps.release_version.outputs.version }}'
          $previousTag = git describe --tags --abbrev=0 "$tag^" 2>$null

          if ($LASTEXITCODE -ne 0 -or -not $previousTag) {
            Write-Host 'No previous release tag found; generating notes from full history.'
            $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" `
              -f "tag_name=$tag" --jq .body
          } else {
            Write-Host "Generating release notes for $previousTag..$tag."
            $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" `
              -f "tag_name=$tag" -f "previous_tag_name=$previousTag" --jq .body
          }

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to generate release notes from merged pull requests.'
          }

          $notesText = $notes -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notesText -Encoding utf8
          @{ version = $version; notes = $notesText } |
            ConvertTo-Json |
            Set-Content -Path 'app/release-notes.json' -Encoding utf8

      - name: Build
        run: bun run --cwd app build

      - name: Package and publish Electron app
        run: bun run --cwd app dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize GitHub release metadata
        shell: pwsh
        run: |
          $tag = '${{ steps.release_version.outputs.tag }}'
          $version = '${{ steps.release_version.outputs.version }}'
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          gh release edit $tag `
            --title "Shuddhalekhan $version" `
            --notes-file $notesFile `
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
